name: Deploy demo to GitHub Pages

# フロントエンドをモックデータ付きで静的書き出しし、GitHub Pages へ公開する。
# バックエンドは動かないので、Excel取り込みの実処理とAI分析の実ロジックは含まれない。

on:
  push:
    branches:
      - main
      - claude/ai-pmo-v0-1-dev-5e3kyf
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static demo
        run: npm run build
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_MOCK: "1"
          NEXT_PUBLIC_MOCK_TASKS: "200"
          NEXT_PUBLIC_MOCK_LABEL_LENGTH: "40"

      # Jekyll に _next/ を消されないようにする
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
